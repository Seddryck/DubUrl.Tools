name: Tools CI and release
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      duburl_version:
        description: Optional published DubUrl version for compatibility testing (never publishes)
        type: string
        default: ''
      schema_version:
        description: Optional published Schema version for compatibility testing (never publishes)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: pwsh
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      patch: ${{ steps.gitversion.outputs.patch }}
      duburl: ${{ steps.dependency.outputs.duburl }}
      schema: ${{ steps.dependency.outputs.schema }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Select version-test SDK
      run: '''{"sdk":{"version":"8.0.416","rollForward":"disable"}}'' | Set-Content global.json'
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.416
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f
      with:
        versionSpec: 6.6.0
    - name: Calculate version
      id: gitversion
      uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f
    - name: Validate versions and select published dependencies
      id: dependency
      env:
        DUBURL_CANDIDATE: ${{ inputs.duburl_version }}
        SCHEMA_CANDIDATE: ${{ inputs.schema_version }}
        TOOLS_VERSION: ${{ steps.gitversion.outputs.semVer }}
      run: |
        [xml]$props = Get-Content Directory.Build.props -Raw
        $duburl = if ($env:DUBURL_CANDIDATE) { $env:DUBURL_CANDIDATE } else { ($props.Project.PropertyGroup.DubUrlVersion | Where-Object { $_ }).InnerText }
        $schema = if ($env:SCHEMA_CANDIDATE) { $env:SCHEMA_CANDIDATE } else { ($props.Project.PropertyGroup.SchemaPackageVersion | Where-Object { $_ }).InnerText }
        foreach ($value in @($env:TOOLS_VERSION, $duburl, $schema)) {
          if ($value -notmatch '^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') { throw 'Invalid package version.' }
        }
        "duburl=$duburl" >> $env:GITHUB_OUTPUT
        "schema=$schema" >> $env:GITHUB_OUTPUT
    - name: Test release guards
      run: ./build/Test-ReleaseGuards.ps1
    - name: Test GitVersion against real release histories
      run: |
        dotnet tool install GitVersion.Tool --version 6.6.0 --tool-path artifacts/gitversion
        if ($LASTEXITCODE) { throw 'Installing the version test tool failed.' }
        python build/test_gitversion.py --gitversion artifacts/gitversion/dotnet-gitversion
    - name: Install workflow validation dependencies
      run: python -m pip install -r build/requirements.txt
    - name: Validate repository and workflow boundaries
      run: python -m unittest discover -s build -p test_boundaries.py
  build:
    name: Build and unit tests (${{ matrix.framework }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - framework: net8.0
          sdk: 8.0.416
        - framework: net9.0
          sdk: 9.0.308
        - framework: net10.0
          sdk: 10.0.403
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.sdk }}
    - name: Select framework SDK
      env:
        SELECTED_SDK: ${{ matrix.sdk }}
      run: '@{sdk=@{version=$env:SELECTED_SDK;rollForward=''disable''}} | ConvertTo-Json | Set-Content global.json'
    - name: Restore
      run: dotnet restore DubUrl.Tools.sln -p:TargetFramework=${{ matrix.framework }}
    - name: Build
      run: dotnet build DubUrl.Tools.sln --configuration Release --framework ${{ matrix.framework }} --no-restore --nologo -p:Version=${{ needs.version.outputs.semver }} -p:ContinuousIntegrationBuild=true
    - name: Test
      shell: pwsh
      run: |
        $projects = @(
            'DubUrl.Application.Testing/DubUrl.Application.Testing.csproj'
            'DubUrl.Cli.Testing/DubUrl.Cli.Testing.csproj'
            'DubUrl.Worker.Testing/DubUrl.Worker.Testing.csproj'
            'QA/DubUrl.Provider.Testing/DubUrl.Tools.QA.Testing.csproj'
          )
        $failedProjects = @()

        foreach ($project in $projects) {
          $projectName = [IO.Path]::GetFileNameWithoutExtension($project) -replace '\.Testing$', ''
          dotnet test $project `
            --configuration Release `
            --framework '${{ matrix.framework }}' `
            --no-build `
            --no-restore `
            --nologo `
            --logger trx `
            --results-directory ".test-results/$projectName/${{ matrix.framework }}" `
            --collect:'XPlat Code Coverage'
          if ($LASTEXITCODE -ne 0) {
            $failedProjects += $project
          }
        }

        $results = @(Get-ChildItem .test-results -Recurse -Filter *.trx)
        if ($results.Count -lt $projects.Count) { throw 'Missing test result files.' }
        foreach ($result in $results) { [xml]$trx = Get-Content $result.FullName -Raw; if ([int]$trx.TestRun.ResultSummary.Counters.executed -le 0) { throw 'A test project executed no tests.' } }
        if ($failedProjects.Count -ne 0) {
          throw "Unit tests failed for: $($failedProjects -join ', ')."
        }
    - name: Collect coverage reports
      shell: pwsh
      run: |
        $projects = @('DubUrl.Application', 'DubUrl.Cli', 'DubUrl.Worker', 'DubUrl.Tools.QA')
        New-Item -ItemType Directory -Force .coverage | Out-Null

        foreach ($project in $projects) {
          $reports = @(
            Get-ChildItem ".test-results/$project/${{ matrix.framework }}" -Recurse -Filter coverage.cobertura.xml -File |
              Where-Object FullName -NotMatch '[\\/]In[\\/]'
          )
          if ($reports.Count -ne 1) {
            throw "Expected one canonical coverage report for $project, found $($reports.Count)."
          }

          Copy-Item $reports[0].FullName ".coverage/coverage.$project.${{ matrix.framework }}.xml"
        }
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.framework }}-${{ needs.version.outputs.semver }}
        path: .test-results
        include-hidden-files: true
        if-no-files-found: error
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.framework }}-${{ needs.version.outputs.semver }}
        path: .coverage
        include-hidden-files: true
        if-no-files-found: error
    - name: Archive build outputs
      shell: pwsh
      run: |
        $projects = @('DubUrl.Application/DubUrl.Application.csproj')

        $paths = @(
          foreach ($project in $projects) {
            $directory = Split-Path -Parent $project
            "$directory/bin"
            "$directory/obj"
          }
        ) | Sort-Object -Unique | Where-Object { Test-Path -LiteralPath $_ }

        New-Item -ItemType Directory -Force .artifacts/build | Out-Null
        tar -czf ".artifacts/build/build-${{ matrix.framework }}.tar.gz" @paths
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to archive ${{ matrix.framework }} build outputs."
        }
    - name: Upload build outputs
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.framework }}-${{ needs.version.outputs.semver }}
        path: .artifacts/build/build-${{ matrix.framework }}.tar.gz
        compression-level: 0
        retention-days: 1
        if-no-files-found: error
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  coverage-threshold:
    name: Coverage threshold
    needs:
    - build
    - linux-tests
    - version
    runs-on: ubuntu-latest
    steps:
    - name: Download coverage reports
      uses: actions/download-artifact@v7
      with:
        pattern: coverage-*
        path: .coverage
        merge-multiple: true
    - name: Enforce one-percent line coverage
      shell: pwsh
      run: |
        $reports = @(Get-ChildItem .coverage -Filter 'coverage.*.xml' -File)
        if ($reports.Count -ne 12) {
          throw "Expected 12 coverage reports, found $($reports.Count)."
        }

        foreach ($report in $reports) {
          [xml] $coverage = Get-Content -LiteralPath $report.FullName -Raw
          $lineRate = [double]::Parse(
            $coverage.coverage.'line-rate',
            [Globalization.CultureInfo]::InvariantCulture
          )
          if ($lineRate -lt 0.01) {
            throw "Coverage in '$($report.FullName)' is $($lineRate * 100)%, below 1%."
          }
        }
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  coverage-upload:
    name: Upload coverage
    needs:
    - build
    - version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Download coverage reports
      uses: actions/download-artifact@v7
      with:
        pattern: coverage-*
        path: .coverage
        merge-multiple: true
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        directory: .coverage
        fail_ci_if_error: true
        use_oidc: true
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  prepare-catalog:
    needs: version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Download pinned official provider catalog
      run: |
        [xml]$props = Get-Content Directory.Build.props -Raw
        $catalogVersion = ($props.Project.PropertyGroup.ConnectorCatalogVersion | Where-Object { $_ }).InnerText
        if ($catalogVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid pinned catalog version.' }
        New-Item -ItemType Directory -Force .artifacts/connectors | Out-Null
        Invoke-WebRequest "https://github.com/Seddryck/DubUrl/releases/download/v$catalogVersion/connector-catalog.json" -OutFile .artifacts/connectors/connector-catalog.json
        $catalog = Get-Content .artifacts/connectors/connector-catalog.json -Raw | ConvertFrom-Json
        if ($catalog.schemaVersion -ne 2 -or $catalog.entries.Count -eq 0) { throw 'Invalid official connector catalog.' }
        if (@($catalog.entries | Where-Object version -ne $catalogVersion).Count) { throw 'Unexpected provider version in official catalog.' }
    - uses: actions/upload-artifact@v7
      with:
        name: official-connector-catalog
        path: .artifacts/connectors/connector-catalog.json
        if-no-files-found: error
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  package-cli-nuget:
    name: Package CLI NuGet tool
    needs:
    - version
    - build
    - prepare-catalog
    runs-on: windows-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |-
          8.0.416
          9.0.308
          10.0.403
    - name: Download official connector catalog
      uses: actions/download-artifact@v7
      with:
        name: official-connector-catalog
        path: .artifacts/connectors
    - name: Include official connector catalog
      shell: pwsh
      run: Copy-Item .artifacts/connectors/connector-catalog.json DubUrl.Cli/connector-catalog.json
    - name: Pack and validate CLI packages
      shell: pwsh
      env:
        GitVersion_SemVer: ${{ needs.version.outputs.semver }}
      run: ./distribution/build-distribution.ps1 -Mode Pack -Version $env:GitVersion_SemVer -OutputRoot ../.artifacts/cli
    - name: Install and execute local pointer package
      shell: pwsh
      run: |
        dotnet tool install --tool-path .artifacts/tool DubUrl-cli `
          --version '${{ needs.version.outputs.semver }}' `
          --add-source .artifacts/cli/packages `
          --ignore-failed-sources
        if ($LASTEXITCODE -ne 0) { throw 'Installing the local CLI tool package failed.' }
        & .artifacts/tool/duburl --version
        if ($LASTEXITCODE -ne 0) { throw 'Executing the installed CLI tool failed.' }
        $env:DUBURL_ProviderPacks__StorePath = (Join-Path $PWD '.artifacts/fresh-connector-store')
        $listed = & .artifacts/tool/duburl connector list --json | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) { throw 'Listing the official connector catalog failed.' }
        $catalog = Get-Content .artifacts/connectors/connector-catalog.json -Raw | ConvertFrom-Json
        $expectedIds = @($catalog.entries.provider | Sort-Object)
        $actualIds = @($listed.connectors.id | Sort-Object)
        if (@(Compare-Object $expectedIds $actualIds).Count -ne 0) {
          throw 'The packaged CLI connector IDs do not match the official catalog.'
        }
        $connector = @($listed.connectors | Where-Object id -eq 'postgresql-npgsql')
        if ($connector.Count -ne 1 `
            -or -not $connector[0].listed `
            -or $connector[0].installed `
            -or $connector[0].active `
            -or $connector[0].unhealthy) {
          throw 'The packaged CLI did not report PostgreSQL as listed and not installed.'
        }
    - name: Upload CLI packages
      uses: actions/upload-artifact@v7
      with:
        name: cli-nuget-${{ needs.version.outputs.semver }}
        path: .artifacts/cli/packages/*.nupkg
        if-no-files-found: error
    - name: Upload CLI publish outputs (win-x64)
      uses: actions/upload-artifact@v7
      with:
        name: cli-publish-win-x64-${{ needs.version.outputs.semver }}
        path: |
          .artifacts/cli/publish/net8.0/win-x64
          .artifacts/cli/publish/net9.0/win-x64
          .artifacts/cli/publish/net10.0/win-x64
        retention-days: 1
        if-no-files-found: error
    - name: Upload CLI publish outputs (win-arm64)
      uses: actions/upload-artifact@v7
      with:
        name: cli-publish-win-arm64-${{ needs.version.outputs.semver }}
        path: |
          .artifacts/cli/publish/net8.0/win-arm64
          .artifacts/cli/publish/net9.0/win-arm64
          .artifacts/cli/publish/net10.0/win-arm64
        retention-days: 1
        if-no-files-found: error
    - name: Upload CLI publish outputs (linux-x64)
      uses: actions/upload-artifact@v7
      with:
        name: cli-publish-linux-x64-${{ needs.version.outputs.semver }}
        path: |
          .artifacts/cli/publish/net8.0/linux-x64
          .artifacts/cli/publish/net9.0/linux-x64
          .artifacts/cli/publish/net10.0/linux-x64
        retention-days: 1
        if-no-files-found: error
    - name: Upload CLI publish outputs (linux-musl-x64)
      uses: actions/upload-artifact@v7
      with:
        name: cli-publish-linux-musl-x64-${{ needs.version.outputs.semver }}
        path: |
          .artifacts/cli/publish/net8.0/linux-musl-x64
          .artifacts/cli/publish/net9.0/linux-musl-x64
          .artifacts/cli/publish/net10.0/linux-musl-x64
        retention-days: 1
        if-no-files-found: error
    - name: Upload CLI publish outputs (osx-x64)
      uses: actions/upload-artifact@v7
      with:
        name: cli-publish-osx-x64-${{ needs.version.outputs.semver }}
        path: |
          .artifacts/cli/publish/net8.0/osx-x64
          .artifacts/cli/publish/net9.0/osx-x64
          .artifacts/cli/publish/net10.0/osx-x64
        retention-days: 1
        if-no-files-found: error
    - name: Upload CLI publish outputs (osx-arm64)
      uses: actions/upload-artifact@v7
      with:
        name: cli-publish-osx-arm64-${{ needs.version.outputs.semver }}
        path: |
          .artifacts/cli/publish/net8.0/osx-arm64
          .artifacts/cli/publish/net9.0/osx-arm64
          .artifacts/cli/publish/net10.0/osx-arm64
        retention-days: 1
        if-no-files-found: error
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  package-worker-nuget:
    name: Package Worker NuGet tool
    needs:
    - version
    - build
    runs-on: windows-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |-
          8.0.416
          9.0.308
          10.0.403
    - name: Restore worker package project
      run: dotnet restore DubUrl.Worker/DubUrl.Worker.csproj --force-evaluate
    - name: Pack worker tool
      run: dotnet pack DubUrl.Worker/DubUrl.Worker.csproj --configuration Release --no-restore --nologo --output .artifacts/worker -p:Version=${{ needs.version.outputs.semver }} -p:ContinuousIntegrationBuild=true
    - name: Validate worker package set
      shell: pwsh
      run: ./.github/scripts/Test-CliToolPackages.ps1 -PackageDirectory .artifacts/worker -PackageId DubUrl.Worker -CommandName duburl-worker -BuildIdentity DubUrl.Worker -RuntimeIdentifiers 'win-x64;win-arm64;linux-x64;linux-musl-x64;osx-x64;osx-arm64'
    - name: Install and execute worker tool
      shell: pwsh
      run: |
        dotnet tool install --tool-path .artifacts/worker-tool DubUrl.Worker `
          --version '${{ needs.version.outputs.semver }}' `
          --add-source .artifacts/worker `
          --ignore-failed-sources
        if ($LASTEXITCODE -ne 0) { throw 'Installing the local worker tool package failed.' }
        & .artifacts/worker-tool/duburl-worker --version
        if ($LASTEXITCODE -ne 0) { throw 'Executing the installed worker tool failed.' }
    - name: Upload worker package
      uses: actions/upload-artifact@v7
      with:
        name: worker-nuget-${{ needs.version.outputs.semver }}
        path: .artifacts/worker/*.nupkg
        if-no-files-found: error
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  package-worker-distributions:
    name: Worker distribution (${{ matrix.runtime }})
    needs:
    - version
    - build
    - package-worker-nuget
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runtime: win-x64
          runner: windows-latest
          native: true
        - runtime: win-arm64
          runner: windows-latest
          native: false
        - runtime: linux-x64
          runner: ubuntu-latest
          native: true
        - runtime: linux-musl-x64
          runner: ubuntu-latest
          native: false
        - runtime: osx-x64
          runner: macos-15-intel
          native: true
        - runtime: osx-arm64
          runner: macos-latest
          native: true
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.403
    - name: Build worker distribution
      id: distribution
      shell: pwsh
      run: |
        ./distribution/build-worker-distribution.ps1 `
          -Version '${{ needs.version.outputs.semver }}' `
          -Runtime '${{ matrix.runtime }}' `
          -OutputRoot ../.artifacts/worker-distribution
        $archives = @(Get-ChildItem .artifacts/worker-distribution/archives -File)
        if ($archives.Count -ne 1) {
          throw "Expected one worker distribution archive, found $($archives.Count)."
        }
        "path=$($archives[0].FullName)" >> $env:GITHUB_OUTPUT
    - name: Execute extracted native archive
      if: matrix.native
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force .artifacts/worker-extracted | Out-Null
        $archive = '${{ steps.distribution.outputs.path }}'
        if ('${{ matrix.runtime }}' -like 'win-*') {
          Expand-Archive -LiteralPath $archive -DestinationPath .artifacts/worker-extracted
          & .artifacts/worker-extracted/duburl-worker.exe --version
        }
        else {
          tar -xzf $archive -C .artifacts/worker-extracted
          $executable = (Resolve-Path -LiteralPath .artifacts/worker-extracted/duburl-worker).Path
          $mode = [IO.File]::GetUnixFileMode($executable)
          $executeBits = [IO.UnixFileMode]::UserExecute `
            -bor [IO.UnixFileMode]::GroupExecute `
            -bor [IO.UnixFileMode]::OtherExecute
          if (($mode -band $executeBits) -eq 0) { throw "Unix executable mode '$mode' is not executable." }
          & $executable --version
        }
        if ($LASTEXITCODE -ne 0) { throw 'Executing the extracted worker archive failed.' }
    - name: Upload worker distribution
      uses: actions/upload-artifact@v7
      with:
        name: worker-distribution-net10.0-${{ matrix.runtime }}
        path: .artifacts/worker-distribution/archives/duburl-worker-*
        if-no-files-found: error
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  package-cli-distributions:
    name: CLI distribution (${{ matrix.framework }}, ${{ matrix.runtime }})
    needs:
    - version
    - build
    - coverage-threshold
    - package-cli-nuget
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - framework: net8.0
          runtime: win-x64
          runner: windows-latest
          installer: false
          native: true
        - framework: net8.0
          runtime: win-arm64
          runner: windows-latest
          installer: false
          native: false
        - framework: net8.0
          runtime: linux-x64
          runner: ubuntu-latest
          installer: false
          native: true
        - framework: net8.0
          runtime: linux-musl-x64
          runner: ubuntu-latest
          installer: false
          native: false
        - framework: net8.0
          runtime: osx-x64
          runner: macos-15-intel
          installer: false
          native: true
        - framework: net8.0
          runtime: osx-arm64
          runner: macos-latest
          installer: false
          native: true
        - framework: net9.0
          runtime: win-x64
          runner: windows-latest
          installer: false
          native: true
        - framework: net9.0
          runtime: win-arm64
          runner: windows-latest
          installer: false
          native: false
        - framework: net9.0
          runtime: linux-x64
          runner: ubuntu-latest
          installer: false
          native: true
        - framework: net9.0
          runtime: linux-musl-x64
          runner: ubuntu-latest
          installer: false
          native: false
        - framework: net9.0
          runtime: osx-x64
          runner: macos-15-intel
          installer: false
          native: true
        - framework: net9.0
          runtime: osx-arm64
          runner: macos-latest
          installer: false
          native: true
        - framework: net10.0
          runtime: win-x64
          runner: windows-latest
          installer: true
          native: true
        - framework: net10.0
          runtime: win-arm64
          runner: windows-latest
          installer: true
          native: false
        - framework: net10.0
          runtime: linux-x64
          runner: ubuntu-latest
          installer: false
          native: true
        - framework: net10.0
          runtime: linux-musl-x64
          runner: ubuntu-latest
          installer: false
          native: false
        - framework: net10.0
          runtime: osx-x64
          runner: macos-15-intel
          installer: false
          native: true
        - framework: net10.0
          runtime: osx-arm64
          runner: macos-latest
          installer: false
          native: true
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |-
          8.0.416
          9.0.308
          10.0.403
    - name: Download CLI publish outputs
      uses: actions/download-artifact@v7
      with:
        name: cli-publish-${{ matrix.runtime }}-${{ needs.version.outputs.semver }}
        path: .artifacts/cli/publish
    - name: Validate Windows executable icon
      if: startsWith(matrix.runtime, 'win-')
      shell: pwsh
      run: ./.github/scripts/Test-WindowsExecutableIcon.ps1 -Executable '.artifacts/cli/publish/${{ matrix.framework }}/${{ matrix.runtime }}/duburl.exe'
    - name: Archive CLI
      id: archive
      shell: pwsh
      run: |
        ./distribution/build-distribution.ps1 `
          -Mode Archive `
          -Version '${{ needs.version.outputs.semver }}' `
          -Frameworks '${{ matrix.framework }}' `
          -Runtimes '${{ matrix.runtime }}' `
          -OutputRoot ../.artifacts/cli

        $archives = @(Get-ChildItem .artifacts/cli/archives -File)
        if ($archives.Count -ne 1) {
          throw "Expected one CLI distribution archive, found $($archives.Count)."
        }
        "path=$($archives[0].FullName)" >> $env:GITHUB_OUTPUT
    - name: Install Inno Setup
      if: matrix.installer
      shell: pwsh
      run: ./distribution/Install-Iscc.ps1
    - name: Build Windows installer
      if: matrix.installer
      shell: pwsh
      run: ./distribution/build-distribution.ps1 -Mode Bundle -Version '${{ needs.version.outputs.semver }}' -Frameworks '${{ matrix.framework }}' -Runtimes '${{ matrix.runtime }}' -OutputRoot ../.artifacts/cli
    - name: Execute extracted native archive
      if: matrix.native
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force .artifacts/extracted | Out-Null
        $archive = '${{ steps.archive.outputs.path }}'
        if ('${{ matrix.runtime }}' -like 'win-*') {
          Expand-Archive -LiteralPath $archive -DestinationPath .artifacts/extracted
          & .artifacts/extracted/duburl.exe --version
          & .artifacts/extracted/duburl.exe --help
        }
        else {
          tar -xzf $archive -C .artifacts/extracted
          $executable = (Resolve-Path -LiteralPath .artifacts/extracted/duburl).Path
          $mode = [IO.File]::GetUnixFileMode($executable)
          $executeBits = [IO.UnixFileMode]::UserExecute `
            -bor [IO.UnixFileMode]::GroupExecute `
            -bor [IO.UnixFileMode]::OtherExecute
          if (($mode -band $executeBits) -eq 0) { throw "Unix executable mode '$mode' is not executable." }
          & $executable --version
          & $executable --help
        }
        if ($LASTEXITCODE -ne 0) { throw 'Executing the extracted CLI archive failed.' }
    - name: Upload distribution
      uses: actions/upload-artifact@v7
      with:
        name: cli-distribution-${{ matrix.framework }}-${{ matrix.runtime }}
        path: |
          .artifacts/cli/archives/duburl-*
          .artifacts/cli/installers/duburl-*-setup.exe
        if-no-files-found: error
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  package-application:
    name: Package tested Application library
    needs:
    - version
    - build
    - coverage-threshold
    runs-on: windows-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.403
    - name: Download build outputs
      uses: actions/download-artifact@v7
      with:
        pattern: build-*-${{ needs.version.outputs.semver }}
        path: .artifacts/build
        merge-multiple: true
    - name: Extract build outputs
      shell: pwsh
      run: |
        $archives = @(Get-ChildItem .artifacts/build -Filter 'build-*.tar.gz' -File)
        if ($archives.Count -ne 3) {
          throw "Expected three framework build archives, found $($archives.Count)."
        }
        foreach ($archive in $archives | Sort-Object Name) {
          tar -xzf $archive.FullName -C .
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract '$($archive.Name)'."
          }
        }
    - name: Restore package project
      run: dotnet restore "DubUrl.Application/DubUrl.Application.csproj" --force-evaluate
    - name: Pack
      run: dotnet pack "DubUrl.Application/DubUrl.Application.csproj" --configuration Release --no-build --no-restore --nologo --include-symbols --output .artifacts/nuget -p:Version=${{ needs.version.outputs.semver }} -p:ContinuousIntegrationBuild=true
    - name: Validate tested Application package
      run: ./build/Validate-ApplicationPackage.ps1 -Version '${{ needs.version.outputs.semver }}' -Directory .artifacts/nuget
    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-DubUrl.Application-${{ needs.version.outputs.semver }}
        path: .artifacts/nuget
        include-hidden-files: true
        if-no-files-found: error
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  validate-release-assets:
    needs:
    - version
    - package-cli-distributions
    - package-worker-distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v7
      with:
        pattern: cli-distribution-*
        path: .artifacts/release/cli
        merge-multiple: true
    - uses: actions/download-artifact@v7
      with:
        pattern: worker-distribution-*
        path: .artifacts/release/worker
        merge-multiple: true
    - name: Test public release inventory
      run: ./build/Test-ReleaseAssets.ps1
    - name: Validate public release inventory
      run: ./build/ReleaseAssets.ps1 -Version '${{ needs.version.outputs.semver }}' -ArtifactDirectory .artifacts/release
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  reserve-release:
    name: Revalidate version and reserve release tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
    - version
    - package-application
    - package-cli-nuget
    - package-worker-nuget
    - validate-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out tested commit
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Refresh release branch and tags
      run: |
        git fetch origin +refs/heads/main:refs/remotes/origin/main --force --tags
        if ($LASTEXITCODE) { throw 'Refreshing release references failed.' }
    - name: Block release while AppVeyor is configured
      run: |
        if (Test-Path appveyor.yml) { throw 'Remove the legacy publishing workflow before releasing.' }
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f
      with:
        versionSpec: 6.6.0
    - name: Recalculate version
      id: gitversion
      uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f
    - name: Validate tested commit and version
      run: |
        Import-Module ./build/ReleaseGuards.psm1 -Force
        $tested = git rev-parse HEAD
        if ($LASTEXITCODE) { throw 'Reading the tested commit failed.' }
        Assert-TestedCommit -Actual $tested -Expected '${{ github.sha }}'
        Assert-VersionUnchanged -Built '${{ needs.version.outputs.semver }}' -Recalculated '${{ steps.gitversion.outputs.semVer }}'
    - name: Reserve release tag
      run: |
        Import-Module ./build/ReleaseGuards.psm1 -Force
        $tag = 'v${{ needs.version.outputs.semver }}'
        function Get-RemoteTagCommit {
          $refs = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE) { throw 'Inspecting the remote release tag failed.' }
          if ($refs.Count -eq 0) { return $null }
          $peeled = @($refs | Where-Object { $_ -like "*refs/tags/$tag^{}" })
          $ref = if ($peeled.Count) { $peeled[0] } else { $refs[0] }
          return ($ref -split '\s+')[0]
        }
        $decision = Get-TagReservationDecision -ExistingCommit (Get-RemoteTagCommit) -ExpectedCommit '${{ github.sha }}'
        if ($decision -eq 'create') {
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate $tag --message "DubUrl.Tools ${{ needs.version.outputs.semver }}" '${{ github.sha }}'
          if ($LASTEXITCODE) { throw 'Creating the release tag failed.' }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE) {
            $decision = Get-TagReservationDecision -ExistingCommit (Get-RemoteTagCommit) -ExpectedCommit '${{ github.sha }}'
            if ($decision -ne 'reuse') { throw 'Reserving the release tag failed.' }
          }
        }
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  publish-cli-nuget:
    name: Publish CLI NuGet tool
    needs:
    - version
    - reserve-release
    - package-cli-nuget
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check out tested commit
      uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.403
    - name: Download CLI packages
      uses: actions/download-artifact@v7
      with:
        name: cli-nuget-${{ needs.version.outputs.semver }}
        path: .artifacts/cli
    - name: Revalidate CLI package set
      shell: pwsh
      run: ./.github/scripts/Test-CliToolPackages.ps1 -PackageDirectory .artifacts/cli
    - name: Exchange GitHub identity for a NuGet API key
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      with:
        user: Seddryck
    - name: Publish CLI packages
      shell: pwsh
      run: |
        $packages = @(Get-ChildItem .artifacts/cli -Filter *.nupkg -File)
        if ($packages.Count -ne 7) { throw "Expected seven CLI packages, found $($packages.Count)." }
        foreach ($package in $packages) {
          dotnet nuget push $package.FullName `
            --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' `
            --source 'https://api.nuget.org/v3/index.json' `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "Publishing '$($package.Name)' failed." }
        }
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  publish-worker-nuget:
    name: Publish Worker NuGet tool
    needs:
    - version
    - reserve-release
    - package-worker-nuget
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check out tested commit
      uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.403
    - name: Download worker package
      uses: actions/download-artifact@v7
      with:
        name: worker-nuget-${{ needs.version.outputs.semver }}
        path: .artifacts/worker
    - name: Revalidate worker package
      shell: pwsh
      run: |
        $packages = @(Get-ChildItem .artifacts/worker -Filter *.nupkg -File)
        if ($packages.Count -ne 7) { throw "Expected seven worker packages, found $($packages.Count)." }
        ./.github/scripts/Test-CliToolPackages.ps1 `
          -PackageDirectory .artifacts/worker `
          -PackageId DubUrl.Worker `
          -CommandName duburl-worker `
          -BuildIdentity DubUrl.Worker `
          -RuntimeIdentifiers 'win-x64;win-arm64;linux-x64;linux-musl-x64;osx-x64;osx-arm64'
        dotnet tool install --tool-path .artifacts/worker-tool DubUrl.Worker `
          --version '${{ needs.version.outputs.semver }}' `
          --add-source .artifacts/worker `
          --ignore-failed-sources
        if ($LASTEXITCODE -ne 0) { throw 'Reinstalling the worker tool package failed.' }
        & .artifacts/worker-tool/duburl-worker --version
        if ($LASTEXITCODE -ne 0) { throw 'Re-executing the worker tool failed.' }
    - name: Exchange GitHub identity for a NuGet API key
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      with:
        user: Seddryck
    - name: Publish worker package
      shell: pwsh
      run: |
        Get-ChildItem .artifacts/worker -Filter *.nupkg -File | ForEach-Object {
          dotnet nuget push $_.FullName `
            --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' `
            --source 'https://api.nuget.org/v3/index.json' `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "Publishing '$($_.Name)' failed." }
        }
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  publish-application:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
    - version
    - reserve-release
    - package-application
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.403
    - uses: actions/download-artifact@v7
      with:
        name: nuget-DubUrl.Application-${{ needs.version.outputs.semver }}
        path: .artifacts/nuget
    - name: Validate Application package
      run: ./build/Validate-ApplicationPackage.ps1 -Version '${{ needs.version.outputs.semver }}' -Directory .artifacts/nuget
    - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: nuget
      with:
        user: Seddryck
    - name: Publish tested Application package
      env:
        NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
      run: |-
        Get-ChildItem .artifacts/nuget -Filter *.nupkg | ForEach-Object {
          dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE) { throw 'Publishing Application failed.' }
        }
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  github-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.patch == '0'
    needs:
    - version
    - reserve-release
    - publish-application
    - publish-cli-nuget
    - publish-worker-nuget
    - validate-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v7
      with:
        pattern: cli-distribution-*
        path: .artifacts/release/cli
        merge-multiple: true
    - uses: actions/download-artifact@v7
      with:
        pattern: worker-distribution-*
        path: .artifacts/release/worker
        merge-multiple: true
    - name: Publish validated tool distributions
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: ./build/Publish-Release.ps1 -Version '${{ needs.version.outputs.semver }}' -ArtifactDirectory .artifacts/release
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
  linux-tests:
    name: Linux host tests (net10.0)
    needs: version
    runs-on: ubuntu-latest
    env:
      DubUrlVersion: ${{ needs.version.outputs.duburl }}
      SchemaPackageVersion: ${{ needs.version.outputs.schema }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.403
    - name: Build host tests natively
      run: |
        dotnet restore DubUrl.Tools.sln -p:TargetFramework=net10.0
        if ($LASTEXITCODE) { throw 'Restore failed.' }
        dotnet build DubUrl.Tools.sln -c Release -f net10.0 --no-restore
        if ($LASTEXITCODE) { throw 'Build failed.' }
    - name: Run Linux CLI and worker tests
      run: |
        foreach ($project in @('DubUrl.Cli.Testing','DubUrl.Worker.Testing')) {
          dotnet test $project -c Release -f net10.0 --no-build --no-restore --logger trx --results-directory ".test-results/$project"
          if ($LASTEXITCODE) { throw "Linux tests failed for $project." }
          $results = @(Get-ChildItem ".test-results/$project" -Filter *.trx)
          if ($results.Count -ne 1) { throw 'Expected one Linux test result.' }
          [xml]$trx = Get-Content $results[0].FullName -Raw
          if ([int]$trx.TestRun.ResultSummary.Counters.executed -le 0) { throw 'Linux tests did not execute.' }
        }
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: linux-host-results
        path: .test-results
        include-hidden-files: true
        if-no-files-found: error
